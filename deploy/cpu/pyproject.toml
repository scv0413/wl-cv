[project]
name = "wlcv-api-cpu"
version = "0.1.0"
requires-python = "==3.12.*"
dependencies = [
    "fastapi==0.163.2",
    "uvicorn==0.54.0",
    "python-multipart==0.0.34",
    "ultralytics==8.4.202",
    "torch==2.15.0",
    "torchvision==0.29.2",
    "opencv-python==4.14.0.94",
    "av==14.2.0",
    "numpy==2.5.4",
    "pandas==3.1.1",
    "matplotlib==3.11.2",
    "tqdm==4.70.1",
]

[tool.uv]
environments = ["sys_platform == 'linux'"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }
