[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wlcv"
version = "0.1.0"
description = "측면 스내치 영상의 원판 탐지 실험"
requires-python = ">=3.12,<3.13"
dependencies = [
    "filelock",
    "ipyevents",
    "ipywidgets",
    "matplotlib",
    "numpy",
    "opencv-python",
    "pandas",
    "pyyaml",
    "torch",
    "tqdm",
    "ultralytics",
]

[dependency-groups]
dev = [
    "fiftyone==1.22.1",
    "jupyterlab",
    "pytest",
]

[tool.setuptools.packages.find]
include = ["wlcv*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
